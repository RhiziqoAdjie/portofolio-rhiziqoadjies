<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- EmailJS: dipakai untuk mengirim kode reset ke email admin langsung dari browser -->

<body class="admin-body">

<div class="bg-decor">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>
<canvas id="starCanvas" class="star-canvas" aria-hidden="true"></canvas>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <i class="fa-solid fa-key lock-icon"></i>
    <h1>Lupa Password Admin</h1>
    <p class="sub">Kode verifikasi akan dikirim otomatis ke email admin: <strong>zikoadjie@gmail.com</strong></p>

    <!-- STEP 1: kirim kode -->
    <div class="reset-step active" id="step1">
      <button type="button" class="btn-admin-primary" id="sendCodeBtn" style="width:100%;justify-content:center;">
        <i class="fa-solid fa-paper-plane"></i> Kirim Kode via Email
      </button>
      <p class="reset-hint">Kode 6 digit berlaku selama 10 menit. Pastikan kamu memiliki akses ke email tersebut.</p>
    </div>

    <!-- STEP 2: verifikasi kode + password baru -->
    <div class="reset-step" id="step2">
      <form id="resetForm">
        <input type="text" id="codeInput" class="otp-input" maxlength="6" placeholder="••••••" inputmode="numeric" autocomplete="one-time-code" required>
        <input type="password" id="newPassInput" placeholder="Password baru (min. 4 karakter)" required>
        <input type="password" id="confirmPassInput" placeholder="Ulangi password baru" required>
        <button type="submit" class="btn-admin-primary" style="width:100%;justify-content:center;">
          <i class="fa-solid fa-rotate"></i> Reset Password
        </button>
      </form>
      <button type="button" class="btn-lupa-password" id="resendBtn" style="margin-top:14px;">
        <i class="fa-solid fa-rotate-right"></i> Kirim ulang kode
      </button>
    </div>

    <p class="admin-login-error" id="resetError"></p>
    <p class="reset-success" id="resetSuccess"></p>

    <a href="admin.html" class="btn-lupa-password" style="margin-top:16px;">
      <i class="fa-solid fa-arrow-left"></i> Kembali ke Login
    </a>
  </div>
</div>

<div class="admin-toast" id="adminToast"></div>

</html>
